name: techsaathi_ai
description: TechSaathi — Technology Made Simple. Independence Made Possible.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  google_generative_ai: ^0.4.7
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#0B1C3D"
  adaptive_icon_foreground: assets/images/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
